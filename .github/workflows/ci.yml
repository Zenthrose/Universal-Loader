name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libvulkan-dev
    - name: Build
      run: mkdir build && cd build && cmake .. -G Ninja && ninja
    - name: Test
      run: cd build && ctest

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install Vulkan SDK
      run: |
        Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile "vulkan-sdk.exe"
        Start-Process -FilePath "vulkan-sdk.exe" -ArgumentList "/S" -Wait
    - name: Build
      run: mkdir build && cd build && cmake .. -G Ninja && ninja
    - name: Test
      run: cd build && ctest

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: brew install cmake ninja molten-vk
    - name: Build
      run: mkdir build && cd build && cmake .. -G Ninja && ninja
    - name: Test
      run: cd build && ctest